<!-- Source for public/assets/img/og-image.png (the social preview card).
     Rendered at exactly 1200x630 by `npm run og`. Edit here, not the PNG. -->
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    width:1200px;height:630px;overflow:hidden;position:relative;
    background:#17233A;color:#F2EFE8;
    font-family:"DejaVu Serif",Georgia,serif;
  }
  .grid{
    position:absolute;inset:0;
    background-image:
      linear-gradient(#EEEAE0 1px,transparent 1px),
      linear-gradient(90deg,#EEEAE0 1px,transparent 1px);
    background-size:48px 48px;opacity:.04;
  }
  .bar{position:absolute;left:0;right:0;bottom:0;height:14px;background:#9C2B26;}
  .inner{
    position:relative;height:100%;padding:66px 72px 78px;
    display:flex;flex-direction:column;justify-content:space-between;
  }
  .mono{font-family:"DejaVu Sans Mono",monospace;}
  .kicker{
    font-size:21px;letter-spacing:.14em;color:#8B96AC;text-transform:uppercase;
  }
  .brands{
    display:flex;align-items:center;gap:20px;margin:26px 0 22px;
  }
  .brand{
    font-size:44px;font-weight:700;letter-spacing:-.01em;color:#F2EFE8;
  }
  .brand .rev{color:#E8827C;}
  .dot{width:9px;height:9px;border-radius:50%;background:#8A6A2F;flex:none;}
  .headline{
    font-size:52px;line-height:1.14;font-weight:600;max-width:19ch;
  }
  .headline em{font-style:normal;color:#E8827C;}
  .foot{display:flex;align-items:flex-end;justify-content:space-between;gap:30px;}
  .domain{font-size:27px;letter-spacing:.06em;color:#E8827C;}
  .stamp{
    border:1.5px solid rgba(255,255,255,.28);border-radius:3px;
    padding:11px 17px;font-size:17px;letter-spacing:.05em;color:#B9C2D4;
    text-transform:uppercase;
  }
  .play{
    position:absolute;right:72px;top:96px;
    width:118px;height:118px;border-radius:50%;background:#9C2B26;
  }
  .play::after{
    content:"";position:absolute;top:50%;left:54%;transform:translate(-50%,-50%);
    border-style:solid;border-width:24px 0 24px 40px;
    border-color:transparent transparent transparent #fff;
  }
  .playcap{
    position:absolute;right:72px;top:226px;width:118px;text-align:center;
    font-size:14px;letter-spacing:.09em;color:#8B96AC;text-transform:uppercase;
  }
</style>

<div class="grid"></div>
<div class="play"></div>
<div class="playcap mono">Video</div>

<div class="inner">
  <div>
    <div class="kicker mono">Case file #5509082 &nbsp;·&nbsp; Complaint pending, Thane</div>
    <div class="brands">
      <span class="brand">VakilSearch <span class="rev">Reviews</span></span>
      <span class="dot"></span>
      <span class="brand" style="font-size:34px;color:#B9C2D4;">Zolvit</span>
    </div>
    <div class="headline">Ten months, <em>&#8377;65,000 paid</em>, no succession certificate.</div>
  </div>

  <div class="foot">
    <span class="domain mono">vakilsearch.reviews</span>
    <span class="stamp mono">A documented customer account</span>
  </div>
</div>

<div class="bar"></div>
