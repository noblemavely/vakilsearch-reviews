# Cloudflare Workers configuration (Workers Static Assets).
#
# Cloudflare now routes new static sites through Workers rather than Pages, so
# this deploys as a Worker that serves the generated files in public/ directly.
# There is no Worker script — the [assets] binding alone is a complete config.
#
#   npm run build && npx wrangler deploy
#
# The dashboard's "Import a repository" flow uses exactly those two commands.
# The same public/ directory is also served by Netlify (see netlify.toml).

name = "vakilsearch-reviews"
compatibility_date = "2026-09-02"

[assets]
directory = "./public"
# Unknown paths serve public/404.html with a real 404 status, rather than
# falling back to index.html the way a single-page app would.
not_found_handling = "404-page"
