# Cloudflare Pages project configuration.
#
# Deploy from a checkout with:
#   npm run build && npx wrangler pages deploy
#
# The generated site in public/ is committed, so a Git-connected Pages project
# can also be configured with an empty build command and output directory "public".

name = "vakilsearch-reviews"
pages_build_output_dir = "public"
compatibility_date = "2026-09-02"
